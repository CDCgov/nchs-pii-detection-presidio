[project]
name = "nchs-pii-detection-presidio-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "en-core-web-lg",
    "en-core-web-sm",
    "huggingface-hub==0.27.1",
    "matplotlib==3.7.2",
    "numpy==1.23.5",
    "pandas==1.5.3",
    "presidio-analyzer>=2.2.362",
    "scikit-learn==1.3.0",
    "spacy==3.7.2",
    "spacy-huggingface-pipelines>=0.0.4",
    "spacy-transformers>=1.4.0",
    "stanza>=1.11.1",
    "torch==2.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1-py3-none-any.whl" }
